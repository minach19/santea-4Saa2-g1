server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: nutrition-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/santea_nutrition?createDatabaseIfNotExist=true}
    username: ${DATABASE_USER:santea}
    password: ${DATABASE_PASSWORD:santea_dev}

server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: patient-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/santea_patients}
    username: ${DATABASE_USER:santea}
    password: ${DATABASE_PASSWORD:santea_dev}
